aid: nebu
name: Nebu
description: >-
  NEBU (legal entity NEBU LAH SDN. BHD., Malaysia) is an early-stage, AI-powered
  DevOps-as-a-Service platform positioned as "the missing brain for your cloud" —
  offering intelligent understanding of cloud infrastructure rather than scripted
  automation alone. Founded in 2024, the company markets AIOps/MLOps-style cloud
  management, cost optimization, and intelligent automation for enterprise cloud
  estates, and self-states a security posture of SOC 2 Type II readiness, ISO 27001,
  and GDPR compliance. As of this profile the product is pre-launch ("we're building
  what comes next") with a single-page marketing site and no public API, developer
  documentation, or SDKs yet. Surfaced as a 500 Global portfolio company and added to
  the API Evangelist network as an enrichment lead; the only machine-readable surface
  found is a valid RFC 9116 /.well-known/security.txt.
